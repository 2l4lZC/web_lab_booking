# =============================================================
#  高校智能实验室预约管理系统 —— Nginx 配置示例
#
#  放置位置（Ubuntu/Debian）：/etc/nginx/sites-available/lab-booking
#  启用：ln -s /etc/nginx/sites-available/lab-booking /etc/nginx/sites-enabled/
#  检查：nginx -t      重载：systemctl reload nginx
#
#  把 your-domain.com 换成你的实际域名
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 前端构建产物目录（npm run build 生成的 dist）
    root /var/www/lab-booking/dist;
    index index.html;

    # 上传体积限制（当前功能用不到，留着备用）
    client_max_body_size 10m;

    # 访问日志
    access_log /var/log/nginx/lab-booking.access.log;
    error_log  /var/log/nginx/lab-booking.error.log;

    # ---------------------------------------------------------
    # 前端静态资源
    # ---------------------------------------------------------
    location / {
        # ⚠️ 这一行是关键：前端用的是 history 路由，
        #    没有它，用户刷新 /labs 或 /admin/stats 会直接 404
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的文件名，内容变了文件名就变，可以放心长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不能缓存，否则发版后用户还在用旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------------------------------------------------------
    # 后端 API 反向代理
    # ---------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置，避免慢查询把连接一直挂住
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ---------------------------------------------------------
    # 安全响应头
    # ---------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------
    # HTTPS 说明
    #
    # 跑完 certbot 后它会自动改写这个文件，加上 443 段和证书路径。
    # 命令：sudo certbot --nginx -d your-domain.com
    #
    # 扫码签到必须走 HTTPS —— 浏览器只在 HTTPS 或 localhost 下
    # 才允许调用摄像头（getUserMedia），http:// 访问时扫码功能会被拒绝。
    # ---------------------------------------------------------
}
